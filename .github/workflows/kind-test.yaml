name: Kind Cluster Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  helm-lint:
    name: Helm Chart Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint memcached chart
        run: |
          helm lint charts/memcached

      - name: Lint secret-generator chart
        run: |
          helm lint charts/secret-generator

      - name: Template memcached chart
        run: |
          helm template test-memcached charts/memcached

      - name: Template secret-generator chart
        run: |
          helm template test-secret-generator charts/secret-generator

  kind-test:
    name: Kind Cluster Deployment Test
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Create Kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: openstack-test
          config: kind-cluster.yaml
          wait: 5m

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -A

      - name: Create openstack namespace
        run: |
          kubectl create namespace openstack

      - name: Install memcached chart
        run: |
          helm install memcached charts/memcached -n openstack --wait --timeout 5m

      - name: Verify memcached deployment
        run: |
          kubectl get all -n openstack -l app.kubernetes.io/name=memcached
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=memcached -n openstack --timeout=300s

      - name: Test memcached connectivity
        run: |
          kubectl run -n openstack memcached-test --image=busybox:1.36 --rm -it --restart=Never -- sh -c "nc -zv memcached.openstack.svc.cluster.local 11211" || true

      - name: Install secret-generator chart
        run: |
          helm install test-secret charts/secret-generator -n openstack --wait --timeout 2m

      - name: Verify secret-generator
        run: |
          kubectl get secret -n openstack test-secret-openstack-secrets

      - name: Show cluster status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo "=== Services ==="
          kubectl get svc -A
          echo "=== Events ==="
          kubectl get events -n openstack --sort-by='.lastTimestamp'

      - name: Show pod logs on failure
        if: failure()
        run: |
          echo "=== Memcached logs ==="
          kubectl logs -n openstack -l app.kubernetes.io/name=memcached --tail=100 || true
