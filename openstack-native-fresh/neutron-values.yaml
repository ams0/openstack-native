# OpenStack-Helm Neutron values for fresh cluster
# Neutron provides networking-as-a-service for OpenStack

labels:
  agent:
    dhcp:
      node_selector_key: kubernetes.io/os
      node_selector_value: linux
    l3:
      node_selector_key: kubernetes.io/os
      node_selector_value: linux
    metadata:
      node_selector_key: kubernetes.io/os
      node_selector_value: linux
  lb:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux
  ovs:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux
  server:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux
  test:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux
  job:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux

# Network backend - using Linux Bridge for simplicity
# Options: openvswitch, linuxbridge, ovn
network:
  backend: linuxbridge
  interface:
    tunnel: docker0

# For kind cluster, we'll use a simple flat network
conf:
  neutron:
    DEFAULT:
      l3_ha: False
      max_l3_agents_per_router: 1
      l3_ha_net_cidr: 169.254.192.0/18
      dhcp_agents_per_network: 1
      global_physnet_mtu: 1500
      # Disable port security by default for simplicity
      port_security_enabled: False

  plugins:
    ml2_conf:
      ml2:
        type_drivers: flat,vlan,vxlan
        tenant_network_types: vxlan
        mechanism_drivers: linuxbridge,l2population
        extension_drivers: port_security
      ml2_type_flat:
        flat_networks: public
      ml2_type_vlan:
        network_vlan_ranges: public:1:4094
      ml2_type_vxlan:
        vni_ranges: 1:1000
        vxlan_group: 239.1.1.1

    linuxbridge_agent:
      linux_bridge:
        physical_interface_mappings: public:docker0
      vxlan:
        enable_vxlan: True
        local_ip: 0.0.0.0  # Will be set by the pod
        l2_population: True
      securitygroup:
        firewall_driver: neutron.agent.linux.iptables_firewall.IptablesFirewallDriver
        enable_security_group: True

    openvswitch_agent:
      ovs:
        bridge_mappings: public:br-ex
        datapath_type: system
      agent:
        tunnel_types: vxlan
        l2_population: True
      securitygroup:
        firewall_driver: neutron.agent.linux.iptables_firewall.OVSHybridIptablesFirewallDriver
        enable_security_group: True

  # Disable RabbitMQ HA policies for single-node setup
  rabbitmq:
    policies: []

endpoints:
  # Memcached configuration
  oslo_cache:
    hosts:
      default: memcached-service
    port:
      memcache:
        default: 11211

  # RabbitMQ configuration
  oslo_messaging:
    scheme: rabbit
    hosts:
      default: openstack-rabbitmq
    port:
      amqp:
        default: 5672
    path: /neutron
    auth:
      admin:
        # Get these from: kubectl get secret -n openstack openstack-rabbitmq-default-user
        username: RABBITMQ_ADMIN_USER
        password: RABBITMQ_ADMIN_PASSWORD
      neutron:
        username: neutron
        password: neutron

  # MariaDB configuration
  oslo_db:
    scheme: mysql+pymysql
    hosts:
      default: mariadb-basic
    port:
      mysql:
        default: 3306
    path: /neutron
    auth:
      neutron:
        username: neutron
        password: neutron  # Helm will create user with this password
      admin:
        # Get root password from: kubectl get secret -n openstack mariadb-basic-root
        username: root
        password: MARIADB_ROOT_PASSWORD

  # Keystone configuration
  identity:
    name: keystone
    auth:
      admin:
        region_name: RegionOne
        username: admin
        password: password
        project_name: admin
        user_domain_name: default
        project_domain_name: default
      neutron:
        role: admin
        region_name: RegionOne
        username: neutron
        password: password
        project_name: service
        user_domain_name: service
        project_domain_name: service
      nova:
        role: admin
        region_name: RegionOne
        username: nova
        password: password
        project_name: service
        user_domain_name: service
        project_domain_name: service
    hosts:
      default: keystone
      internal: keystone-api
    path:
      default: /v3
    scheme:
      default: http
    port:
      api:
        default: 80
        internal: 5000

  # Nova notifications (for port binding events)
  # Will be used when Nova is deployed
  compute:
    name: nova
    hosts:
      default: nova-api
      public: nova
    host_fqdn_override:
      default: null
    path:
      default: "/v2.1"
    scheme:
      default: 'http'
    port:
      api:
        default: 8774
        public: 80
      metadata:
        default: 8775
      novncproxy:
        default: 6080

  # Neutron API endpoint
  network:
    name: neutron
    hosts:
      default: neutron-server
      public: neutron
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: 'http'
    port:
      api:
        default: 9696
        public: 80

# Pod resources
pod:
  resources:
    enabled: true
    server:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    dhcp_agent:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    l3_agent:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    metadata_agent:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    lb_agent:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"

# Manifests - enable/disable components
manifests:
  daemonset_dhcp_agent: true
  daemonset_l3_agent: true
  daemonset_lb_agent: true
  daemonset_metadata_agent: true
  daemonset_ovs_agent: false  # Using Linux Bridge instead
  daemonset_sriov_agent: false
  deployment_server: true
  job_db_init: true
  job_db_sync: true
  job_db_drop: false
  job_ks_endpoints: true
  job_ks_service: true
  job_ks_user: true
  job_rabbit_init: true
  pod_rally_test: true
  service_server: true
