# Memcached values for OpenStack control plane
# Used for session caching in Horizon and other OpenStack services

labels:
  server:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux

conf:
  memcached:
    max_connections: 8192
    memory: 1024
    stats_cachedump:
      enabled: true

endpoints:
  oslo_cache:
    namespace: openstack
    hosts:
      default: memcached
    port:
      memcache:
        default: 11211
      metrics:
        default: 9150

manifests:
  configmap_bin: true
  statefulset: true
  job_image_repo_sync: true
  network_policy: false
  service: true
  secret_registry: true
