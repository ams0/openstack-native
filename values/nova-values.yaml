# Nova configuration
conf:
  # Disable Ceph storage backend
  ceph:
    enabled: false

  # Disable RabbitMQ HA policies (not compatible with RabbitMQ 4.x)
  rabbitmq:
    policies: []

  nova:
    DEFAULT:
      # Enable metadata service
      enabled_apis: osapi_compute,metadata
      # Use neutron for networking
      use_neutron: true
      # VNC configuration
      vnc_enabled: true
      vncserver_proxyclient_address: "0.0.0.0"
      # Scheduler configuration
      scheduler_default_filters: AvailabilityZoneFilter,ComputeFilter,ComputeCapabilitiesFilter,ImagePropertiesFilter,ServerGroupAntiAffinityFilter,ServerGroupAffinityFilter
      # Enable debug logging
      debug: true
      log_level: DEBUG

    # Libvirt configuration for compute nodes
    libvirt:
      connection_uri: "qemu:///system"  # Direct connection without socket path
      virt_type: qemu  # Use qemu on AKS (no nested virtualization)
      cpu_mode: host-passthrough
      live_migration_uri: qemu+ssh://nova@%s/system?keyfile=/var/lib/nova/.ssh/id_rsa&no_verify=1
      images_type: qcow2  # Use qcow2 instead of RBD
      images_rbd_pool: ""  # Disable RBD
      images_rbd_ceph_conf: ""

# Pod configuration - increase file descriptor limits
pod:
  security_context:
    nova_rabbit_init:
      pod:
        runAsUser: 65534
      container:
        rabbit_init:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
  resources:
    rabbit_init:
      limits:
        cpu: "2000m"
        memory: "1024Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"

  # Configure health probes for nova-compute
  probes:
    compute:
      default:
        startup:
          enabled: true
          params:
            initialDelaySeconds: 30  # Give nova-compute time to initialize
            failureThreshold: 120
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 70

# Manifests - Control Plane + Compute Nodes
manifests:
  daemonset_compute: true            # Enable nova-compute on openstack-compute-node nodes
  daemonset_libvirt: false           # Disable - using separate libvirt chart
  daemonset_compute_ironic: false    # Disable ironic compute
  statefulset_compute_ironic: false  # Disable ironic statefulset

  # Keep control plane components enabled
  deployment_api_metadata: true
  deployment_api_osapi: true
  deployment_conductor: true
  deployment_novncproxy: true
  deployment_scheduler: true
  job_storage_init: false            # Disable Ceph storage init for qcow2/non-Ceph setup
  job_db_init: true
  job_db_sync: true
  job_ks_endpoints: true
  job_ks_service: true
  job_ks_user: true
  job_rabbit_init: true              # Needed for nova vhost/user setup
  job_cell_setup: false
  cron_job_cell_setup: false

# Keep jobs as standard resources so init containers can resolve them.
helm3_hook: false

# Control-plane-only: remove dependency on compute pods during cell setup.
dependencies:
  static:
    cell_setup:
      pod: []

# Disable TLS for RabbitMQ connections (certs not configured)
tls:
  oslo_messaging: false
