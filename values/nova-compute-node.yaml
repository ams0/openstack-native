# OpenStack-Helm Nova values for Compute Node
# This configuration deploys ONLY Nova Compute + Libvirt
# Control plane services (API, Scheduler, Conductor) run separately

labels:
  # Target specific compute nodes with a custom label
  # Apply this label to your compute nodes:
  #   kubectl label node <node-name> openstack-compute-node=enabled
  agent:
    compute:
      node_selector_key: openstack-compute-node
      node_selector_value: enabled
    compute_ironic:
      node_selector_key: openstack-compute-node
      node_selector_value: enabled
  job:
    node_selector_key: openstack-compute-node
    node_selector_value: enabled
  test:
    node_selector_key: openstack-compute-node
    node_selector_value: enabled

# Nova Compute Configuration
conf:
  nova:
    DEFAULT:
      # Compute-specific settings
      compute_driver: libvirt.LibvirtDriver

      # Instance management
      instances_path: /var/lib/nova/instances
      instance_usage_audit: True
      instance_usage_audit_period: hour

      # Resize/migration settings
      allow_resize_to_same_host: True
      resize_fs_using_block_device: False

      # Scheduler hints
      scheduler_default_filters: RetryFilter,AvailabilityZoneFilter,ComputeFilter,ComputeCapabilitiesFilter,ImagePropertiesFilter,ServerGroupAntiAffinityFilter,ServerGroupAffinityFilter

      # Resource tracking
      reserved_host_memory_mb: 2048
      reserved_host_cpus: 1

      # Networking
      use_neutron: True
      firewall_driver: nova.virt.firewall.NoopFirewallDriver

      # VNC Console
      vnc_enabled: True
      vncserver_listen: 0.0.0.0
      vncserver_proxyclient_address: $my_ip
      # novncproxy_base_url must point to control plane novncproxy
      # Format: http://<control-plane-ip>:6080/vnc_auto.html
      # Will be set via novncproxy endpoint

      # Logging
      debug: False
      log_dir: /var/log/nova

      # API settings (compute nodes don't run API)
      enabled_apis: ""

    # Libvirt Configuration
    libvirt:
      # Virtualization type: kvm (hardware virt) or qemu (software)
      virt_type: kvm

      # CPU mode: host-model (recommended), host-passthrough, or custom
      cpu_mode: host-model

      # Live migration settings
      live_migration_uri: qemu+ssh://nova@%s/system?keyfile=/var/lib/nova/.ssh/id_rsa&no_verify=1
      live_migration_tunnelled: False
      live_migration_with_native_tls: False
      live_migration_completion_timeout: 800
      live_migration_progress_timeout: 150

      # Disk settings
      disk_cachemodes: "network=writeback,block=none"
      hw_disk_discard: unmap

      # Image type: raw, qcow2, etc.
      images_type: qcow2

      # Inject partition (for cloud-init)
      inject_partition: -2
      inject_password: False
      inject_key: False

      # Resource management
      cpu_allocation_ratio: 4.0
      ram_allocation_ratio: 1.0
      disk_allocation_ratio: 1.0

    # Neutron Integration
    neutron:
      # Neutron API endpoint (control plane)
      url: http://neutron-server.openstack.svc.cluster.local:9696
      region_name: RegionOne

      # Metadata proxy secret (must match neutron metadata agent)
      metadata_proxy_shared_secret: "changeme-metadata-secret"

      # OVS Integration bridge
      ovs_bridge: br-int

      # Security groups
      firewall_driver: nova.virt.firewall.NoopFirewallDriver

    # Placement Integration
    placement:
      # Placement API endpoint (control plane)
      region_name: RegionOne

    # Cinder Integration (Block Storage)
    cinder:
      catalog_info: volumev3:cinderv3:internalURL
      os_region_name: RegionOne

    # Glance Integration (Image Service)
    glance:
      api_servers: http://glance-api.openstack.svc.cluster.local:9292

  # Libvirt configuration file
  libvirt:
    # Listen on TCP for live migration (use with caution in production)
    listen_tcp: 1
    listen_tls: 0
    tcp_port: 16509

    # Authentication for live migration
    auth_tcp: none

    # Logging
    log_level: 3
    log_outputs: "3:syslog"
    log_filters: "1:libvirt 1:qemu 1:conf 1:security 3:event 3:json 3:file 3:object 1:util"

  # Neutron ML2 OVS Agent (runs on compute nodes)
  neutron:
    DEFAULT:
      interface_driver: openvswitch

  plugins:
    ml2_conf:
      ml2:
        type_drivers: flat,vlan,vxlan,gre
        tenant_network_types: vxlan,vlan
        mechanism_drivers: openvswitch,l2population

      ml2_type_vxlan:
        vni_ranges: 1:100000

    openvswitch_agent:
      agent:
        tunnel_types: vxlan
        l2_population: True
        arp_responder: True
        enable_distributed_routing: False

      ovs:
        # Integration bridge (where VM ports are attached)
        integration_bridge: br-int
        # Tunnel bridge (for VXLAN tunnels to other compute/network nodes)
        tunnel_bridge: br-tun
        # Local IP for VXLAN tunnels (auto-detected from tunnel interface)
        local_ip: null
        # Bridge mappings (usually empty on compute nodes)
        bridge_mappings: ""

      securitygroup:
        firewall_driver: openvswitch
        enable_security_group: True
        enable_ipset: True

  # SSH key for live migration
  ssh:
    enabled: true
    # SSH key will be generated automatically
    # or provide your own:
    # private_key: |
    #   -----BEGIN RSA PRIVATE KEY-----
    #   ...
    #   -----END RSA PRIVATE KEY-----
    # public_key: "ssh-rsa ..."

