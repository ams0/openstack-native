  # NoVNC Proxy (control plane)
  compute_novnc_proxy:
    name: nova
    hosts:
      default: nova-novncproxy
      public: nova-novncproxy
    path:
      default: /vnc_auto.html
    scheme:
      default: http
    port:
      novnc_proxy:
        default: 6080
        public: 6080

# Pod Configuration
pod:
  # Security contexts - compute needs extensive privileges
  security_context:
    nova_compute:
      pod:
        runAsUser: 0  # Must run as root
        hostNetwork: true
        hostPID: true
        hostIPC: true
      container:
        nova_compute:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN
              - NET_ADMIN
              - SYS_NICE
              - SYS_PTRACE
        nova_compute_ssh:
          privileged: false

    nova_libvirt:
      pod:
        runAsUser: 0
        hostNetwork: true
        hostPID: true
        hostIPC: true
      container:
        nova_libvirt:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN
              - NET_ADMIN
              - SYS_NICE
              - SYS_PTRACE
              - DAC_READ_SEARCH

  # Resource limits
  resources:
    enabled: true
    nova_compute:
      limits:
        memory: "4Gi"
        cpu: "2000m"
      requests:
        memory: "2Gi"
        cpu: "1000m"
    nova_libvirt:
      limits:
        memory: "2Gi"
        cpu: "1000m"
      requests:
        memory: "512Mi"
        cpu: "500m"

# Manifests - Deploy ONLY compute, NO control plane
manifests:
  configmap_bin: true
  configmap_etc: true

  # Control plane - DISABLED
  deployment_api_metadata: false      # ❌ Metadata API (runs on control plane)
  deployment_api_osapi: false         # ❌ Nova API (runs on control plane)
  deployment_conductor: false         # ❌ Conductor (runs on control plane)
  deployment_consoleauth: false       # ❌ Deprecated
  deployment_novncproxy: false        # ❌ NoVNC Proxy (runs on control plane)
  deployment_placement: false         # ❌ Placement (separate service)
  deployment_scheduler: false         # ❌ Scheduler (runs on control plane)
  deployment_spiceproxy: false        # ❌ SPICE Proxy

  # Compute - ENABLED
  daemonset_compute: true             # ✅ Nova Compute (runs VMs)
  daemonset_libvirt: true             # ✅ Libvirt (virtualization)

  # Compute-specific
  daemonset_compute_ironic: false     # ❌ Ironic compute (bare metal)
  statefulset_compute_ironic: false   # ❌ Ironic compute

  # Jobs - DISABLED (already done on control plane)
  job_bootstrap: false                # ❌ No bootstrap
  job_cell_setup: false               # ❌ No cell setup
  job_db_init: false                  # ❌ No DB init
  job_db_sync: false                  # ❌ No DB sync
  job_db_drop: false                  # ❌ No DB operations
  job_image_repo_sync: false          # ❌ No image sync
  job_ks_endpoints: false             # ❌ No Keystone endpoints
  job_ks_service: false               # ❌ No Keystone service
  job_ks_user: false                  # ❌ No Keystone user
  job_rabbit_init: false              # ❌ No RabbitMQ init

  # Services - DISABLED
  ingress_metadata: false             # ❌ No ingress
  ingress_osapi: false                # ❌ No ingress
  service_ingress_metadata: false     # ❌ No service
  service_ingress_osapi: false        # ❌ No service
  service_metadata: false             # ❌ No service
  service_novncproxy: false           # ❌ No service
  service_osapi: false                # ❌ No service
  service_placement: false            # ❌ No service

  # Secrets - ENABLED (needed by compute)
  secret_db: true                     # ✅ DB credentials
  secret_keystone: true               # ✅ Keystone credentials
  secret_rabbitmq: true               # ✅ RabbitMQ credentials

  # Cron jobs - DISABLED
  cron_job_service_cleaner: false     # ❌ Service cleaner (runs on control plane)

  # Other
  pdb_metadata: false                 # ❌ No PDB
  pdb_osapi: false                    # ❌ No PDB
  pdb_placement: false                # ❌ No PDB
  pod_rally_test: false               # ❌ No tests

# Storage
storage:
  # Ephemeral storage for instances
  ephemeral:
    enabled: true
    # Use host path for instance storage
    type: hostPath
    hostPath:
      path: /var/lib/nova/instances

  # Image cache
  image_cache:
    enabled: true
    size: 50Gi

# Network Configuration
network:
  backend:
    - openvswitch

  # Neutron OVS agent configuration
  interface:
    tunnel: "eth0"  # Tunnel interface for VXLAN

# Dependencies
dependencies:
  static:
    nova_compute:
      services:
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: oslo_messaging
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: placement
        - endpoint: internal
          service: network
        - endpoint: internal
          service: image
      daemonset:
        - nova-libvirt

# Disable TLS for RabbitMQ connections (matching control plane)
tls:
  oslo_messaging: false
