# OpenStack-Helm Keystone values for fresh cluster
labels:
  api:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  test:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

endpoints:
  # Memcached configuration
  oslo_cache:
    hosts:
      default: memcached-service
    port:
      memcache:
        default: 11211

  # RabbitMQ configuration (TLS enabled)
  oslo_messaging:
    scheme: rabbit
    hosts:
      default: openstack-rabbitmq
    port:
      amqp:
        default: 5671  # AMQPS port (TLS)
    path: /keystone
    auth:
      admin:
        username: admin
        password: REPLACE_WITH_RABBITMQ_ADMIN_PASSWORD
        secret:
          tls:
            internal: rabbitmq-tls-secret
      keystone:
        username: keystone
        password: REPLACE_WITH_RABBITMQ_KEYSTONE_PASSWORD

  # MariaDB configuration
  oslo_db:
    scheme: mysql+pymysql
    hosts:
      default: mariadb-basic
    port:
      mysql:
        default: 3306
    path: /keystone
    auth:
      keystone:
        username: keystone
        password: keystone
      admin:
        username: root
        password: REPLACE_WITH_MARIADB_ROOT_PASSWORD

conf:
  # Disable RabbitMQ HA policies for single-node setup
  rabbitmq:
    policies: []

# Enable TLS for RabbitMQ connections
tls:
  oslo_messaging: true
