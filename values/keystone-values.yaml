# OpenStack-Helm Keystone values for fresh cluster
labels:
  api:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux
  job:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux
  test:
    node_selector_key: kubernetes.io/os
    node_selector_value: linux

endpoints:
  # Memcached configuration
  oslo_cache:
    hosts:
      default: memcached-service
    port:
      memcache:
        default: 11211

  # RabbitMQ configuration (TLS enabled)
  oslo_messaging:
    scheme: rabbit
    hosts:
      default: openstack-rabbitmq
    port:
      amqp:
        default: 5671  # AMQPS port (TLS)
    path: /keystone
    auth:
      admin:
        username: RABBITMQ_ADMIN_USER
        password: RABBITMQ_ADMIN_PASSWORD
        secret:
          tls:
            internal: rabbitmq-tls-secret
      keystone:
        username: keystone
        password: keystone

  # MariaDB configuration
  oslo_db:
    scheme: mysql+pymysql
    hosts:
      default: mariadb-basic
    port:
      mysql:
        default: 3306
    path: /keystone
    auth:
      keystone:
        username: keystone
        password: keystone  # Helm will create user with this password
      admin:
        username: root
        password: PASSWORD_PLACEHOLDER

conf:
  # Disable RabbitMQ HA policies for single-node setup
  rabbitmq:
    policies: []

# Enable TLS for RabbitMQ connections
tls:
  oslo_messaging: true
