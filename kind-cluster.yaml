kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 31000
    hostPort: 31000
    listenAddress: "0.0.0.0"
    protocol: TCP
  - containerPort: 31001
    hostPort: 31001
    listenAddress: "0.0.0.0"
    protocol: TCP
  - containerPort: 31002
    hostPort: 31002
    listenAddress: "0.0.0.0"
    protocol: TCP
  - containerPort: 80
    hostPort: 80
    listenAddress: "0.0.0.0"
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    listenAddress: "0.0.0.0"
    protocol: TCP
  - containerPort: 5672
    hostPort: 5672
    listenAddress: "0.0.0.0"
    protocol: TCP  

