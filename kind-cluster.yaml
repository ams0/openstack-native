kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  # Every values/*.yaml selects on this label (labels.api.node_selector_key).
  # Without it OpenStack pods stay Pending forever.
  labels:
    openstack-control-plane: enabled
  extraPortMappings:
  # Horizon dashboard (values/horizon-values.yaml)
  - containerPort: 31000
    hostPort: 31000
    listenAddress: "0.0.0.0"
    protocol: TCP
  # Skyline dashboard (values/skyline-values.yaml)
  - containerPort: 31001
    hostPort: 31001
    listenAddress: "0.0.0.0"
    protocol: TCP
  # Spare NodePort
  - containerPort: 31002
    hostPort: 31002
    listenAddress: "0.0.0.0"
    protocol: TCP
  # NOTE: host ports 80, 443 and 5672 are deliberately NOT mapped here.
  # kind would bind them on 0.0.0.0, which prevents cloud-provider-kind from
  # publishing LoadBalancer Services on the same host ports. Expose services
  # via type=LoadBalancer (see docs/KIND-ADDONS.md) or the NodePorts above.
