---
# Pre-created secrets for OpenStack services
# These secrets should be created manually or via Sealed Secrets
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-basic-root
  namespace: openstack
type: Opaque
stringData:
  password: "CHANGEME_MARIADB_ROOT_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: openstack-rabbitmq-default-user
  namespace: openstack
type: Opaque
stringData:
  username: "admin"
  password: "CHANGEME_RABBITMQ_ADMIN_PASSWORD"
  default_user.conf: |
    default_user = admin
    default_pass = CHANGEME_RABBITMQ_ADMIN_PASSWORD
---
# Keystone-specific RabbitMQ user (already exists but documenting)
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-keystone-user
  namespace: openstack
type: Opaque
stringData:
  username: "keystone"
  password: "CHANGEME_RABBITMQ_KEYSTONE_PASSWORD"
