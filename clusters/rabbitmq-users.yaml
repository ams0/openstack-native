---
# RabbitMQ users and vhosts for OpenStack services
# Apply AFTER the RabbitmqCluster is ready
apiVersion: rabbitmq.com/v1beta1
kind: Vhost
metadata:
  name: keystone
  namespace: openstack
spec:
  name: keystone
  rabbitmqClusterReference:
    name: openstack-rabbitmq
---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: keystone-user
  namespace: openstack
spec:
  tags:
  - administrator
  rabbitmqClusterReference:
    name: openstack-rabbitmq
  importCredentialsSecret:
    name: rabbitmq-keystone-user
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: keystone-user-permission
  namespace: openstack
spec:
  vhost: keystone
  userReference:
    name: keystone-user
  permissions:
    write: ".*"
    configure: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: openstack-rabbitmq
