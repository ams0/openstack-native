apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://github.com/rabbitmq/cluster-operator.git
      path: config/crd/bases
      targetRevision: main
    - repoURL: https://github.com/rabbitmq/messaging-topology-operator.git
      path: config/crd/bases
      targetRevision: main
    - repoURL: https://github.com/ams0/openstack-native.git
      targetRevision: main
      path: kustomizations/rabbitmq
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
