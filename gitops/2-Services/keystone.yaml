apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keystone
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  # Use multiple sources (requires ArgoCD 2.6+)
  sources:
    # 1. Base Helm chart
    - repoURL: https://opendev.org/openstack/openstack-helm
      targetRevision: master
      path: keystone
      helm:
        releaseName: keystone
        valueFiles:
          # Base values from git (no passwords)
          - $values/values/keystone-values-base.yaml
          # Secret-derived values from ConfigMap
          - $secrets/secret-values.yaml

    # 2. Git repo with base values (no passwords)
    - repoURL: https://github.com/ams0/openstack-native
      targetRevision: main
      ref: values

    # 3. ConfigMap with secret-derived values (generated by PreSync job)
    - repoURL: ""  # Empty means in-cluster
      targetRevision: ""
      ref: secrets
      chart: ""
      helm:
        valueFiles:
          - /configmaps/openstack/keystone-secret-values/secret-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: openstack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
