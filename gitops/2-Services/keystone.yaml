apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keystone
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  # Multi-source: upstream Helm chart + base values from git
  sources:
    # 1. Upstream OpenStack Helm chart with base values from git ref
    - repoURL: https://opendev.org/openstack/openstack-helm
      targetRevision: master
      path: keystone
      helm:
        releaseName: keystone
        valueFiles:
          - $values/values/keystone-values.yaml

    # 2. This repo — provides the base values file (passwords are placeholders)
    - repoURL: https://github.com/ams0/openstack-native
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: openstack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
