---
# Job that runs before Keystone deployment to generate Helm values from secrets
apiVersion: batch/v1
kind: Job
metadata:
  name: keystone-generate-values
  namespace: openstack
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "9"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: keystone-values-generator
      restartPolicy: Never
      containers:
      - name: generate-values
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "Retrieving passwords from secrets..."

          # Get passwords from secrets
          MARIADB_PASSWORD=$(kubectl get secret -n openstack mariadb-basic-root -o jsonpath='{.data.password}' | base64 -d)
          RABBITMQ_ADMIN_USER=$(kubectl get secret -n openstack openstack-rabbitmq-default-user -o jsonpath='{.data.username}' | base64 -d 2>/dev/null || echo "admin")
          RABBITMQ_ADMIN_PASSWORD=$(kubectl get secret -n openstack openstack-rabbitmq-default-user -o jsonpath='{.data.password}' | base64 -d)
          RABBITMQ_KEYSTONE_PASSWORD=$(kubectl get secret -n openstack rabbitmq-keystone-user -o jsonpath='{.data.password}' | base64 -d)

          echo "Generating Helm values ConfigMap..."

          # Create ConfigMap with values
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: keystone-secret-values
            namespace: openstack
          data:
            secret-values.yaml: |
              endpoints:
                oslo_db:
                  auth:
                    admin:
                      username: root
                      password: "${MARIADB_PASSWORD}"
                    keystone:
                      username: keystone
                      password: keystone
                oslo_messaging:
                  auth:
                    admin:
                      username: "${RABBITMQ_ADMIN_USER}"
                      password: "${RABBITMQ_ADMIN_PASSWORD}"
                    keystone:
                      username: keystone
                      password: "${RABBITMQ_KEYSTONE_PASSWORD}"
          EOF

          echo "✓ ConfigMap created successfully!"
---
# ServiceAccount for the job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keystone-values-generator
  namespace: openstack
---
# Role to read secrets and create ConfigMaps
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keystone-values-generator
  namespace: openstack
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - mariadb-basic-root
    - openstack-rabbitmq-default-user
    - rabbitmq-keystone-user
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update", "patch"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keystone-values-generator
  namespace: openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keystone-values-generator
subjects:
- kind: ServiceAccount
  name: keystone-values-generator
  namespace: openstack
