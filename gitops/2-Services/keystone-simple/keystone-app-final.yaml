apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keystone
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  source:
    repoURL: https://opendev.org/openstack/openstack-helm
    targetRevision: master
    path: keystone
    helm:
      releaseName: keystone

      # Inline values that will be merged with base values
      # These come from the ConfigMap created by PreSync job
      values: |
        # Base configuration (non-secret)
        labels:
          api:
            node_selector_key: openstack-control-plane
            node_selector_value: enabled
          job:
            node_selector_key: openstack-control-plane
            node_selector_value: enabled

        endpoints:
          oslo_cache:
            hosts:
              default: memcached-service

          # MariaDB - passwords injected by PreSync job
          oslo_db:
            scheme: mysql+pymysql
            hosts:
              default: mariadb-basic
            port:
              mysql:
                default: 3306
            path: /keystone
            auth:
              keystone:
                username: keystone
                password: keystone
              admin:
                username: root
                password: "{{ .Values.secrets.mariadb_password }}"

          # RabbitMQ - passwords injected by PreSync job
          oslo_messaging:
            scheme: rabbit
            hosts:
              default: openstack-rabbitmq
            port:
              amqp:
                default: 5671
            path: /keystone
            auth:
              keystone:
                username: keystone
                password: "{{ .Values.secrets.keystone_rabbitmq_password }}"
              admin:
                username: "{{ .Values.secrets.rabbitmq_user }}"
                password: "{{ .Values.secrets.rabbitmq_password }}"
              secret:
                tls:
                  internal: rabbitmq-tls-secret

        tls:
          oslo_messaging: true

        conf:
          rabbitmq:
            policies: []

      # Alternatively: reference the ConfigMap as a parameter
      # This is injected by ArgoCD at render time
      parameters:
        - name: secrets.mariadb_password
          value: $ARGOCD_APP_SOURCE_REPO_URL  # Placeholder, will be replaced

  destination:
    server: https://kubernetes.default.svc
    namespace: openstack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
