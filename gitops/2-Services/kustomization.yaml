apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openstack

# Generate a ConfigMap with Helm values from secrets
configMapGenerator:
  - name: keystone-helm-values
    namespace: openstack
    options:
      disableNameSuffixHash: true
    files:
      - values.yaml=keystone-values-template.yaml

# Patch the values with actual secrets
replacements:
  # MariaDB root password
  - source:
      kind: Secret
      name: mariadb-basic-root
      namespace: openstack
      fieldPath: data.password
    targets:
      - select:
          kind: ConfigMap
          name: keystone-helm-values
        fieldPaths:
          - data.[values.yaml]
        options:
          delimiter: ':'
          index: 1
          create: true

  # RabbitMQ admin password
  - source:
      kind: Secret
      name: openstack-rabbitmq-default-user
      namespace: openstack
      fieldPath: data.password
    targets:
      - select:
          kind: ConfigMap
          name: keystone-helm-values
        fieldPaths:
          - data.[values.yaml]
        options:
          delimiter: ':'
          index: 1
          create: true

resources:
  - keystone-app.yaml
