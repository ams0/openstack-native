apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keystone
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  source:
    repoURL: https://github.com/ams0/openstack-native
    targetRevision: main
    path: charts/keystone-wrapper
    helm:
      releaseName: keystone
      # Reference the secret as a values file
      # This works because the wrapper chart will fetch the real chart
      parameters:
        - name: secret.name
          value: keystone-helm-values-secret
        - name: secret.namespace
          value: openstack

  destination:
    server: https://kubernetes.default.svc
    namespace: openstack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: ""
      kind: Secret
      name: keystone-helm-values-secret
      jsonPointers:
        - /data
