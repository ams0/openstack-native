---
# ServiceAccount for ESO to access secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-kubernetes
  namespace: openstack
---
# Role to read secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-secret-reader
  namespace: openstack
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-secret-reader
  namespace: openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-secret-reader
subjects:
- kind: ServiceAccount
  name: external-secrets-kubernetes
  namespace: openstack
---
# SecretStore that reads from Kubernetes secrets
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openstack-secrets
  namespace: openstack
spec:
  provider:
    kubernetes:
      # Read secrets from the same namespace
      remoteNamespace: openstack
      auth:
        serviceAccount:
          name: external-secrets-kubernetes
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
