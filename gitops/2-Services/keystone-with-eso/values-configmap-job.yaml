---
# Job that copies ESO-generated secret to a ConfigMap for Helm
apiVersion: batch/v1
kind: Job
metadata:
  name: keystone-values-to-configmap
  namespace: openstack
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "9"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: keystone-values-copier
      restartPolicy: Never
      containers:
      - name: copy-values
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Waiting for ExternalSecret to generate the secret..."

          # Wait for secret to exist
          while ! kubectl get secret keystone-helm-values-secret -n openstack 2>/dev/null; do
            echo "Waiting for keystone-helm-values-secret..."
            sleep 2
          done

          echo "Secret found, creating ConfigMap..."

          # Get the values.yaml from the secret
          VALUES=$(kubectl get secret keystone-helm-values-secret -n openstack -o jsonpath='{.data.values\.yaml}' | base64 -d)

          # Create ConfigMap with the values
          kubectl create configmap keystone-helm-values \
            --from-literal=values.yaml="$VALUES" \
            --namespace=openstack \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "✓ ConfigMap created successfully!"
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keystone-values-copier
  namespace: openstack
---
# Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keystone-values-copier
  namespace: openstack
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - keystone-helm-values-secret
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update", "patch"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keystone-values-copier
  namespace: openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keystone-values-copier
subjects:
- kind: ServiceAccount
  name: keystone-values-copier
  namespace: openstack
